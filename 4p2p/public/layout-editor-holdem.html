<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>28 Gulan Hold'em — Visual Layout Editor</title>
<link rel="stylesheet" href="layout-editor.css?v=10">
</head>
<body>
<!-- Big, impossible-to-miss build banner -- full width, top of the page,
     above everything else, before any toolbar buttons that could get cut
     off/wrapped on a narrow phone screen. Bumped on every delivered fix
     so there's a single, obvious, unmissable way to tell whether a phone
     is actually running the latest files or a stale/undeployed copy --
     no functional purpose otherwise. -->
<div id="edBuildBanner" style="background:#f4c430;color:#1a1206;font-size:1.15rem;font-weight:900;text-align:center;padding:10px 6px;letter-spacing:0.04em;position:sticky;top:0;z-index:999999">BUILD V10</div>
<div id="edRoot">
  <div id="edTopbar">
    <h1>🎰 Hold'em Table Layout Editor</h1>
    <span id="edBuildTag" style="font-size:0.65rem;color:#5a7a9a;font-weight:700;letter-spacing:0.03em">build v10</span>
    <div class="ed-sep"></div>
    <select id="edBreakpointSelect"></select>
    <button class="ed-btn" id="edBtnEditToggle">✏️ Edit Table: OFF</button>
    <div class="ed-sep"></div>
    <div class="ed-zoom-group">
      <button class="ed-btn" id="edBtnZoomOut" title="Zoom out">−</button>
      <span id="edZoomLabel">100%</span>
      <button class="ed-btn" id="edBtnZoomIn" title="Zoom in">+</button>
      <button class="ed-btn" id="edBtnZoomFit" title="Fit to screen">Fit</button>
    </div>
    <div class="ed-sep"></div>
    <button class="ed-btn" id="edBtnUndo" disabled>↶ Undo</button>
    <button class="ed-btn" id="edBtnRedo" disabled>↷ Redo</button>
    <button class="ed-btn danger" id="edBtnReset">Reset Layout</button>
    <div class="ed-sep"></div>
    <button class="ed-btn primary" id="edBtnSave">💾 Save Layout</button>
    <div id="edStatus">Loading current layout…</div>
  </div>
  <div id="edBody">
    <div id="edStage">
      <div id="edFrameWrap">
        <iframe id="edFrame" src="holdem.html"></iframe>
      </div>
    </div>
    <div id="edSidebar">
      <div class="ed-sidebar-section" style="flex:1 1 55%">
        <h2>Layers</h2>
        <div id="edLayers"></div>
      </div>
      <div class="ed-sidebar-section" style="flex:1 1 45%;overflow-y:auto">
        <h2>Selected Element</h2>
        <div id="edInspector"><div class="ed-inspector-empty">Join or host a table inside the frame and start a hand so the real seats are on screen, turn on Edit Table, then click an element (or pick one from Layers) to adjust it here.</div></div>
      </div>
    </div>
  </div>
</div>
<!-- ?v=8 cache-busts these two files specifically: a phone browser (or a
     CDN in front of the live site) can keep serving an old cached copy of
     a .js file under its old URL even after the file on disk changed.
     Bump this number on every future delivery -- a new URL can never
     return a stale cached response, so this makes "the fix didn't show
     up" impossible for these two files regardless of any cache
     configuration upstream. -->
<script src="layout-engine-holdem.js?v=10"></script>
<script src="layout-editor-holdem.js?v=10"></script>
</body>
</html>
