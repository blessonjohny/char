<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>28 Gulan Hold'em — Visual Layout Editor</title>
<link rel="stylesheet" href="layout-editor.css">
</head>
<body>
<div id="edRoot">
  <div id="edTopbar">
    <h1>🎰 Hold'em Table Layout Editor</h1>
    <div class="ed-sep"></div>
    <select id="edBreakpointSelect"></select>
    <button class="ed-btn" id="edBtnEditToggle">✏️ Edit Table: OFF</button>
    <div class="ed-sep"></div>
    <div class="ed-zoom-group">
      <button class="ed-btn" id="edBtnZoomOut" title="Zoom out">−</button>
      <span id="edZoomLabel">100%</span>
      <button class="ed-btn" id="edBtnZoomIn" title="Zoom in">+</button>
      <button class="ed-btn" id="edBtnZoomFit" title="Fit to screen">Fit</button>
    </div>
    <div class="ed-sep"></div>
    <button class="ed-btn" id="edBtnUndo" disabled>↶ Undo</button>
    <button class="ed-btn" id="edBtnRedo" disabled>↷ Redo</button>
    <button class="ed-btn danger" id="edBtnReset">Reset Layout</button>
    <div class="ed-sep"></div>
    <button class="ed-btn primary" id="edBtnSave">💾 Save Layout</button>
    <div id="edStatus">Loading current layout…</div>
  </div>
  <div id="edBody">
    <div id="edStage">
      <div id="edFrameWrap">
        <iframe id="edFrame" src="holdem.html"></iframe>
      </div>
    </div>
    <div id="edSidebar">
      <div class="ed-sidebar-section" style="flex:1 1 55%">
        <h2>Layers</h2>
        <div id="edLayers"></div>
      </div>
      <div class="ed-sidebar-section" style="flex:1 1 45%;overflow-y:auto">
        <h2>Selected Element</h2>
        <div id="edInspector"><div class="ed-inspector-empty">Join or host a table inside the frame and start a hand so the real seats are on screen, turn on Edit Table, then click an element (or pick one from Layers) to adjust it here.</div></div>
      </div>
    </div>
  </div>
</div>
<script src="layout-engine-holdem.js"></script>
<script src="layout-editor-holdem.js"></script>
</body>
</html>
