<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1, user-scalable=no stop the BROWSER's own native pinch/
     ctrl-scroll page zoom here, same reasoning as the Hold'em editor --
     real zoom comes entirely from the +/-/Fit buttons and the ctrl+scroll/
     pinch handling in layout-editor-6p.js. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>28 Gulan Six-Player — Visual Layout Editor</title>
<link rel="stylesheet" href="layout-editor.css?v=12">
<link rel="stylesheet" href="layout-editor-6p.css?v=1">
</head>
<body>
<div id="edRoot">
  <div id="edTopbar">
    <h1>🎲 6-Player Layout Editor</h1>
    <span id="edBuildTag" title="Build version">v1</span>
    <select id="edBreakpointSelect"></select>
    <button class="ed-btn" id="edBtnEditToggle">✏️ Edit Table</button>
    <div class="ed-dropdown-wrap">
      <button class="ed-btn" id="edBtnLayersToggle" type="button">🗂️ Layers</button>
      <div class="ed-dropdown-panel" id="edLayersPanel" style="display:none">
        <div class="ed-sidebar-section">
          <h2>Layers</h2>
          <div id="edLayers"></div>
        </div>
      </div>
    </div>
    <div class="ed-zoom-group">
      <button class="ed-btn" id="edBtnZoomOut" title="Zoom out">−</button>
      <span id="edZoomLabel">100%</span>
      <button class="ed-btn" id="edBtnZoomIn" title="Zoom in">+</button>
      <button class="ed-btn" id="edBtnZoomFit" title="Fit to screen">Fit</button>
    </div>
    <button class="ed-btn" id="edBtnUndo" disabled title="Undo">↶</button>
    <button class="ed-btn" id="edBtnRedo" disabled title="Redo">↷</button>
    <button class="ed-btn danger" id="edBtnReset" title="Reset this layout">Reset</button>
    <button class="ed-btn primary" id="edBtnSave">💾 Save</button>
    <div id="edStatus">Loading…</div>
  </div>
  <div id="edBody">
    <div id="edStage">
      <div id="edFrameWrap">
        <!-- editorPreview=1 (handled by six.js's IS_EDITOR_PREVIEW, mirroring
             holdem.html's identical mechanism exactly) makes this iframe
             auto-create its own private, server-flagged-hidden practice
             table instead of touching/exposing any real one -- see the
             IS_EDITOR_PREVIEW branches in six.js and the `preview`/`hidden`
             handling in server.js's sixp_createTable/sixp_joinTable. Real
             confirmed bug fix per live report: "when I'm editing it's going
             live and people join". -->
        <iframe id="edFrame" src="play6.html?editorPreview=1"></iframe>
      </div>
    </div>
    <div id="edPropsBar">
      <div id="edInspector"><div class="ed-inspector-empty">Turn on Edit Table, then tap an element (or pick one from Layers) -- the frame auto-hosts a private practice table with bots for you.</div></div>
    </div>
  </div>
</div>
<!-- ?v= cache-busts these files -- bump on every future delivery. -->
<script src="layout-engine-6p.js?v=3"></script>
<script src="layout-editor-6p.js?v=3"></script>
</body>
</html>
