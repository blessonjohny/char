<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>28 Kerala Gulan — Comments Admin</title>
<style>
  :root{--bg:#0a1628;--panel:#111d2e;--accent:#f4c430;--text:#fff;--text2:#9fb0c3;--border:rgba(255,255,255,0.12);--danger:#ff5c5c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0a1628,#0d1b2a,#111d2e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:1.3rem;background:linear-gradient(135deg,#f4c430,#e6a817);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 4px}
  .sub{color:var(--text2);font-size:0.8rem;margin-bottom:20px}
  .gate{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:40px}
  .gate input{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:rgba(255,255,255,0.05);color:#fff;font-size:1rem;margin-bottom:12px;text-align:center;letter-spacing:2px}
  button{font-family:inherit;cursor:pointer}
  .btn{padding:12px 18px;border-radius:10px;border:none;font-weight:700;font-size:0.9rem;background:linear-gradient(135deg,#f4c430,#e6a817);color:#0a1628;width:100%}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);font-weight:600}
  .toolbar{display:flex;gap:8px;margin-bottom:14px}
  .toolbar .btn{width:auto;flex:1}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
  .card .name{font-weight:800;color:var(--accent);font-size:0.85rem}
  .card .time{color:var(--text2);font-size:0.68rem;white-space:nowrap}
  .card .msg{font-size:0.88rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .card .del{margin-top:10px;background:transparent;border:1px solid rgba(255,92,92,0.4);color:var(--danger);border-radius:8px;padding:6px 10px;font-size:0.72rem}
  .empty{color:var(--text2);text-align:center;padding:40px 10px;font-size:0.85rem}
  .err{color:var(--danger);font-size:0.8rem;text-align:center;margin-top:8px;display:none}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-weight:700;font-size:0.82rem}
  .tab.on{background:linear-gradient(135deg,#f4c430,#e6a817);color:#0a1628;border-color:transparent}
  .live-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .live-card .who{font-weight:800;color:#fff;font-size:0.88rem}
  .live-card .where{color:var(--text2);font-size:0.72rem;margin-top:2px}
  .live-card .game-badge{background:rgba(244,196,48,0.15);color:var(--accent);font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .live-card.disconnected{opacity:0.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>💌 Comments — Admin</h1>
  <div class="sub">28 Kerala Gulan · messages left from the welcome screen</div>

  <div class="gate" id="gate">
    <input type="password" id="pwd" placeholder="Admin password" autocomplete="off">
    <button class="btn" id="btnEnter">Unlock</button>
    <div class="err" id="gateErr">Wrong password.</div>
  </div>

  <div id="panel" style="display:none">
    <div class="tabs">
      <button class="tab on" id="tabComments">💌 Comments</button>
      <button class="tab" id="tabLive">🟢 Live Players</button>
      <button class="tab" id="tabVisitors">📊 Visitor Log</button>
    </div>
    <div id="commentsView">
      <div class="toolbar">
        <button class="btn ghost" id="btnRefresh">🔄 Refresh</button>
      </div>
      <div id="list"></div>
    </div>
    <div id="liveView" style="display:none">
      <div class="toolbar">
        <span class="sub" id="liveCount" style="margin:0;align-self:center">—</span>
        <button class="btn ghost" id="btnRefreshLive">🔄 Refresh</button>
      </div>
      <div id="liveList"></div>
    </div>
    <div id="visitorsView" style="display:none">
      <div class="toolbar">
        <button class="btn ghost" id="btnRefreshVisitors">🔄 Refresh</button>
      </div>
      <div id="visitorSummary" style="display:flex;gap:8px;margin-bottom:12px"></div>
      <div id="visitorFilters" class="tabs" style="margin-bottom:12px">
        <button class="tab on" data-filter="today">Today</button>
        <button class="tab" data-filter="week">This Week</button>
        <button class="tab" data-filter="month">This Month</button>
        <button class="tab" data-filter="all">All Time</button>
      </div>
      <div id="visitorList"></div>
    </div>
  </div>
</div>

<script>
let PASSWORD = '';

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleString();
}

// Sends the admin password as a header instead of a URL query string
// (?password=...) -- a URL is the wrong place for a secret since it
// commonly ends up in server access logs and browser history just from
// normal use. `pwd` is only passed explicitly by unlock() below, before
// PASSWORD is actually set yet; everything else just uses PASSWORD.
function adminFetch(url, pwd, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'x-admin-password': pwd !== undefined ? pwd : PASSWORD });
  return fetch(url, options);
}

async function unlock() {
  const pwd = document.getElementById('pwd').value;
  // Checks the password against /api/live-players (properly
  // password-protected) rather than /api/comments -- /api/comments is
  // deliberately public (it's also the game's public comment wall on the
  // welcome screen), so it was never actually validating anything here.
  // Any typed password, even a wrong one, used to silently "log in".
  const res = await adminFetch('/api/live-players', pwd);
  if (!res.ok) {
    const errEl = document.getElementById('gateErr');
    errEl.textContent = res.status === 429 ? 'Too many wrong attempts — try again in a few minutes.' : 'Wrong password.';
    errEl.style.display = 'block';
    return;
  }
  PASSWORD = pwd;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  refresh();
}

async function refresh() {
  const res = await adminFetch('/api/comments');
  if (!res.ok) { document.getElementById('panel').style.display = 'none'; document.getElementById('gate').style.display = 'block'; return; }
  const data = await res.json();
  render(data.comments || []);
}

async function del(id) {
  if (!confirm('Delete this comment?')) return;
  await adminFetch('/api/comments/' + id, undefined, { method: 'DELETE' });
  refresh();
}

function render(list) {
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="empty">No comments yet.</div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="card">
      <div class="top">
        <span class="name">${esc(c.name)}</span>
        <span class="time">${esc(fmtTime(c.time))}</span>
      </div>
      <div class="msg">${esc(c.message)}</div>
      <button class="del" onclick="del('${c.id}')">Delete</button>
    </div>
  `).join('');
}

document.getElementById('btnEnter').addEventListener('click', unlock);
document.getElementById('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
document.getElementById('btnRefresh').addEventListener('click', refresh);

// ---------------- Live players (who's currently connected, and where from) ----------------
let liveRefreshInterval = null;

function switchTab(tab) {
  document.getElementById('tabComments').classList.toggle('on', tab === 'comments');
  document.getElementById('tabLive').classList.toggle('on', tab === 'live');
  document.getElementById('tabVisitors').classList.toggle('on', tab === 'visitors');
  document.getElementById('commentsView').style.display = tab === 'comments' ? 'block' : 'none';
  document.getElementById('liveView').style.display = tab === 'live' ? 'block' : 'none';
  document.getElementById('visitorsView').style.display = tab === 'visitors' ? 'block' : 'none';
  if (tab === 'live') {
    refreshLivePlayers();
    if (!liveRefreshInterval) liveRefreshInterval = setInterval(refreshLivePlayers, 5000);
  } else if (liveRefreshInterval) {
    clearInterval(liveRefreshInterval);
    liveRefreshInterval = null;
  }
  if (tab === 'visitors') refreshVisitorLog();
}

async function refreshLivePlayers() {
  const res = await adminFetch('/api/live-players');
  if (!res.ok) return;
  const data = await res.json();
  renderLivePlayers(data.players || []);
}

function renderLivePlayers(players) {
  const el = document.getElementById('liveList');
  const countEl = document.getElementById('liveCount');
  const connectedCount = players.filter(p => p.connected).length;
  countEl.textContent = `${connectedCount} connected · ${players.length} seated`;
  if (!players.length) { el.innerHTML = '<div class="empty">Nobody seated at any table right now.</div>'; return; }
  // De-duplicate to one row per table (players array is per-seat) so the
  // close button appears once per table, not once per person at it.
  const byTable = new Map();
  for (const p of players) {
    if (!byTable.has(p.tableId)) byTable.set(p.tableId, { game: p.game, tableId: p.tableId, people: [] });
    byTable.get(p.tableId).people.push(p);
  }
  el.innerHTML = Array.from(byTable.values()).map(t => `
    <div class="live-card" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="game-badge">${esc(t.game)} · table ${esc(t.tableId)}</span>
        <button class="btn ghost" style="padding:4px 10px;font-size:0.72rem" onclick="closeTable('${esc(t.tableId)}')">✕ Close table</button>
      </div>
      ${t.people.map(p => `<div class="who" style="font-size:0.8rem">${esc(p.name)}${p.connected ? '' : ' (disconnected)'} — 📍 ${esc(p.location)}</div>`).join('')}
    </div>
  `).join('');
}

async function closeTable(tableId) {
  if (!confirm(`Force-close table ${tableId}? Everyone there gets sent home immediately, no matter what's happening.`)) return;
  const res = await adminFetch('/api/admin/close-table', undefined, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tableId })
  });
  const data = await res.json();
  if (data.ok) { alert(`Closed ${data.game} table ${data.tableId}.`); refreshLivePlayers(); }
  else alert('Could not close that table: ' + (data.error || 'unknown error'));
}

document.getElementById('tabComments').addEventListener('click', () => switchTab('comments'));
document.getElementById('tabLive').addEventListener('click', () => switchTab('live'));
document.getElementById('tabVisitors').addEventListener('click', () => switchTab('visitors'));
document.getElementById('btnRefreshLive').addEventListener('click', refreshLivePlayers);

// ---------------- Visitor log (everyone who's ever visited, with location and time) ----------------
let visitorFilter = 'today';

async function refreshVisitorLog() {
  const res = await adminFetch('/api/visitor-log?filter=' + encodeURIComponent(visitorFilter));
  if (!res.ok) return;
  const data = await res.json();
  renderVisitorLog(data.entries || [], data.summary || {});
}

function renderVisitorLog(entries, summary) {
  const summaryEl = document.getElementById('visitorSummary');
  summaryEl.innerHTML = `
    <div class="live-card" style="flex:1;flex-direction:column;text-align:center;gap:2px">
      <span class="who" style="font-size:1.1rem">${summary.today?.unique ?? 0}</span>
      <span class="where">unique today (${summary.today?.visits ?? 0} visits)</span>
    </div>
    <div class="live-card" style="flex:1;flex-direction:column;text-align:center;gap:2px">
      <span class="who" style="font-size:1.1rem">${summary.week?.unique ?? 0}</span>
      <span class="where">unique this week (${summary.week?.visits ?? 0} visits)</span>
    </div>
    <div class="live-card" style="flex:1;flex-direction:column;text-align:center;gap:2px">
      <span class="who" style="font-size:1.1rem">${summary.month?.unique ?? 0}</span>
      <span class="where">unique this month (${summary.month?.visits ?? 0} visits)</span>
    </div>
    <div class="live-card" style="flex:1;flex-direction:column;text-align:center;gap:2px">
      <span class="who" style="font-size:1.1rem">${summary.all?.unique ?? 0}</span>
      <span class="where">unique all time (${summary.all?.visits ?? 0} visits)</span>
    </div>
  `;
  const listEl = document.getElementById('visitorList');
  if (!entries.length) { listEl.innerHTML = '<div class="empty">No visits logged for this period.</div>'; return; }
  // Same IP appearing more than once in the currently-loaded entries is
  // exactly the "refreshed the page" / "opened two tabs" signal worth
  // flagging visually, since the header numbers above already fix the
  // headline unique-vs-total confusion.
  const ipCounts = {};
  entries.forEach(e => { if (e.ip) ipCounts[e.ip] = (ipCounts[e.ip] || 0) + 1; });
  listEl.innerHTML = entries.map(e => {
    const dup = e.ip && ipCounts[e.ip] > 1;
    const location = [e.city, e.region, e.country].filter(Boolean).join(', ') || 'Unknown location';
    const deviceLine = [e.device, e.os, e.browser].filter(Boolean).join(' · ') || 'Unknown device';
    const badges = [
      e.returning ? '🔁 returning' : '✨ new',
      dup ? `⚠️ seen ${ipCounts[e.ip]}× in this view` : ''
    ].filter(Boolean).join(' &middot; ');
    return `
      <div class="live-card" style="${dup ? 'background:rgba(255,80,80,0.12);border-color:rgba(255,80,80,0.35)' : ''}">
        <div>
          <div class="who">${esc(e.ip || 'unknown IP')}</div>
          <div class="where">📍 ${esc(location)}</div>
          <div class="where">📱 ${esc(deviceLine)}${e.language ? ' · 🌐 ' + esc(e.language) : ''}</div>
          ${e.referrer ? `<div class="where">↪️ from ${esc(e.referrer)}</div>` : ''}
          <div class="where" style="opacity:0.8">${badges}</div>
        </div>
        <div class="time">${esc(fmtTime(e.ts))}</div>
      </div>
    `;
  }).join('');
}

document.getElementById('btnRefreshVisitors').addEventListener('click', refreshVisitorLog);
document.getElementById('visitorFilters').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  visitorFilter = btn.dataset.filter;
  [...document.getElementById('visitorFilters').children].forEach(b => b.classList.toggle('on', b === btn));
  refreshVisitorLog();
});
</script>
</body>
</html>
