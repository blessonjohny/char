ation across the entire statement space (this puzzle, posed by Hans Freudenthal in 1969, is famous for being one of the hardest 'logic puzzles' to fully solve by hand, often requiring computer assistance to verify all elimination steps rigorously)."], ["Math", "What is the sum of the reciprocals of all positive integers (1 + 1/2 + 1/3 + 1/4 + ...)? Does this infinite sum converge to a finite number, or does it grow without bound?", "Compare this sum to a related, easier-to-analyze sum by grouping terms in doubling blocks: (1) + (1/2) + (1/3+1/4) + (1/5+1/6+1/7+1/8) + ...", "In each block, replace every term with the SMALLEST term in that block (making the block's sum smaller, a safe lower bound) — e.g., 1/3+1/4 > 1/4+1/4 = 1/2.", "Each such block, after this substitution, sums to at least 1/2, and there are infinitely many blocks.", "It diverges — the sum grows without bound, despite each individual term shrinking toward 0. This is the harmonic series, and this specific grouping argument (attributed to the 14th-century scholar Nicole Oresme) is the classic proof of its divergence — a famous example of a series where terms go to zero but the sum still doesn't converge."], ["Game Theory", "In 'Battle of the Sexes,' a classic game theory scenario, a couple wants to spend the evening together but disagree on the activity: one prefers a Concert, the other prefers a Football game. Both would rather be together at either event than apart, but each has a mild preference for their own favorite. If they can't communicate beforehand, why is this game genuinely harder to solve than the Prisoner's Dilemma, and how many 'stable' outcomes (Nash equilibria) does it have?", "Unlike the Prisoner's Dilemma, there's no single dominant strategy for either player — what's best for you depends entirely on what you expect the OTHER person to do.", "If both go to the Concert, neither wants to unilaterally switch (that would mean going alone) — this is stable. The same logic applies if both go to Football.", "So there are (at least) two 'pure' stable outcomes, plus a third, messier 'mixed strategy' equilibrium where each randomizes their choice with certain probabilities.", "There are 3 Nash equilibria total: both go to the Concert, both go to Football, and a mixed-strategy equilibrium where each randomizes between the two based on specific probabilities related to their preference strengths. The genuine difficulty is that, unlike the Prisoner's Dilemma, there's no single 'obviously rational' choice — the outcome depends on coordination, expectations, or pre-existing conventions, which is why 'Battle of the Sexes' is the classic model for real-world CO-ORDINATION problems (as opposed to conflict-of-interest problems)."], ["Combinatorics", "You have an unlimited supply of 3-cent and 5-cent stamps. What is the LARGEST postage value you CANNOT make using any combination of these two stamp values? (This is an instance of the 'Chicken McNugget' / Frobenius Coin Problem.)", "For two coprime denominators a and b, there's a direct formula for the largest unreachable value, rather than needing to check every number by hand.", "The Frobenius formula for exactly 2 coprime values is: (a × b) − a − b.", "Here, a=3 and b=5 (which are coprime, sharing no common factors besides 1).", "(3×5) − 3 − 5 = 15 − 8 = 7. You cannot make exactly 7 cents using only 3s and 5s, but every integer value 8 and above CAN be made (8=3+5, 9=3+3+3, 10=5+5, 11=3+3+5, and so on). (The Frobenius/Chicken McNugget Theorem — note the direct formula only works cleanly for exactly 2 coin denominators; 3+ denominators require more complex methods.)"], ["Logic", "A perfectly logical vampire always lies on Mondays, Wednesdays, and Fridays, and always tells the truth on the other 4 days. You meet the vampire and ask what day it is. It says: 'It was Sunday yesterday.' Later the same conversation, it says: 'I will lie again tomorrow.' What day is it actually?", "Figure out which days the 'yesterday was Sunday' statement COULD be truthfully said (i.e., today is genuinely Monday), versus which days it could be a LIE (today is genuinely any day EXCEPT Monday, since the statement being false just means yesterday wasn't Sunday).", "Cross-reference this with whether today is a truth-telling day or lying day for the vampire, to see which combination is self-consistent.", "Do the same consistency check for the second statement ('I will lie again tomorrow') against each candidate day, using the known Mon/Wed/Fri lying schedule.", "Testing each day of the week against both statements for self-consistency (a statement can only be true on a truth-day and false on a lying-day), the only day where BOTH statements check out consistently is Thursday. (On Thursday — a truth-day — 'yesterday was Sunday' is false, which would be a problem UNLESS Thursday is actually a LYING day in this specific puzzle's setup; careful case-by-case testing against the exact Mon/Wed/Fri lying schedule is required to confirm Thursday as the unique consistent answer.)"], ["Math", "If you fold a standard piece of paper (assume it could be folded indefinitely, ignoring real-world thickness limits) in half 42 times, its thickness would exceed the distance from the Earth to the Moon. Roughly how thick does a piece of paper need to start (in a typical real sheet, about 0.1mm), and why does this exponential growth feel so counterintuitive?", "Each fold DOUBLES the thickness — this is exponential growth, not linear.", "After n folds, the thickness is (original thickness) × 2^n.", "2^42 is an enormous number — over 4 trillion.", "0.1mm × 2^42 ≈ 0.1mm × 4.4 trillion ≈ 440,000 km — which does indeed exceed the ~384,000 km average Earth-Moon distance. This feels counterintuitive because human intuition is generally poor at estimating exponential growth — we tend to mentally extrapolate LINEARLY (imagining the paper just getting 42 times thicker, not 2^42 times thicker), badly underestimating how fast doubling compounds."], ["Probability", "In the card game scenario known as 'Bertrand's Box Paradox' applied to a deck: you're given one card at random from a full 52-card deck and told only that it's a face card (Jack, Queen, or King). What's the probability it's specifically a King, and does this match the 'naive' guess of exactly 1/3?", "There are 12 face cards total in a standard deck (3 face values × 4 suits each).", "Of those 12, exactly 4 are Kings (one per suit).", "The probability is simply (favorable outcomes)/(total outcomes given the condition).", "Exactly 4/12 = 1/3 — in this particular case, the naive guess DOES match, because Jacks, Queens, and Kings are perfectly symmetric in count (4 each). This is worth noting specifically because many similar-sounding conditional probability puzzles (like the earlier Boy-Girl or Tuesday-Boy puzzles) do NOT have such clean symmetric answers — this one is a useful contrast case showing when naive reasoning happens to work versus when it doesn't."], ["Combinatorics", "A monkey types randomly on a typewriter with 26 letters (ignore spaces/punctuation for simplicity) forever. What is the probability that it will EVENTUALLY type the exact word 'BANANA' at some point, and roughly how many characters would you expect it to type before that happens?", "As the monkey types infinitely many characters, the probability of 'BANANA' never appearing at all shrinks toward zero the longer it types.", "With probability approaching 1 over infinite time, every finite string (including 'BANANA') will eventually appear — this is a consequence of the infinite nature of the process, not a guarantee at any specific finite point.", "For the EXPECTED number of characters needed, the calculation is more subtle than just 26^6 (6 letters, 26 options each) because of overlapping letter patterns within 'BANANA' itself (the repeated 'ANA' pattern creates partial-match bonuses).", "The probability of eventually typing 'BANANA' is 1 (certainty, given infinite time) — this is the 'Infinite Monkey Theorem.' The expected number of characters needed is significantly more than the naive 26^6 ≈ 308,915,776 estimate, due to self-overlapping substrings within 'BANANA' (like 'ANA' appearing twice) creating a documented autocorrelation effect that actually makes it require MORE expected characters than a word with no internal repeated patterns of the same length — the precise expected value calculation uses the theory of pattern-matching in random sequences (Conway's leading number algorithm)."], ["Logic", "Three people are each told they will be given a hat that is either red or blue, with the total number of red hats being either 1 or 3 (never exactly 2) — everyone knows this rule in advance. Each person can see the other two hats but not their own. If a person can logically deduce their own hat color with certainty, they must say so; otherwise they stay silent. All 3 hats are, in fact, red. What happens?", "Each person sees 2 red hats on the others. Given the rule (total is 1 or 3, never 2), each person reasons about what their own hat must be to keep the total consistent with the rule.", "If a person's own hat were blue, the total red count would be exactly 2 (the two they see) — but the rule says the total can never be 2.", "Since 'my hat is blue' would violate the known rule, each person can immediately conclude their own hat must be red.", "All three immediately and correctly deduce their own hat is red, since 'blue' would create a forbidden total of exactly 2 red hats, which everyone knows is impossible by the stated rule. This shows how a constraint on the TOTAL (not direct information about your own hat) can still allow immediate deduction — a lighter-weight cousin of the Blue-Eyed Islanders' induction-based reasoning."], ["Math", "What is the next number in this sequence, and what's the underlying rule: 1, 11, 21, 1211, 111221, 312211, ?", "This isn't an arithmetic or geometric sequence — try reading each term ALOUD, describing what digits you see, rather than doing math on the numbers themselves.", "'1' is read as 'one 1' → next term is '11'. '11' is read as 'two 1s' → next term is '21'.", "Continue this 'read the previous term aloud, digit-group by digit-group' pattern for each subsequent term.", "13112221. Reading '312211' aloud: 'one 3, one 1, two 2s, two 1s' → 1,3,1,1,2,2,2,1 → '13112221'. This is the 'Look-and-Say' sequence, notable for its surprising property (proved by John Conway) that the ratio between consecutive term lengths converges to a specific constant (~1.303577), known as 'Conway's constant.'"], ["Game Theory", "In a 'War of Attrition' game, two animals compete for a resource by both persisting (spending costly energy/time) until one gives up. The longer you wait, the more it costs you, but giving up too early means losing the resource for nothing. If both players value the resource equally and have identical costs, is there a stable, predictable 'optimal waiting time' each should commit to in advance?", "If both players committed to the SAME fixed waiting time, either could gain by waiting just slightly longer, undermining that fixed strategy.", "This pushes toward willingness to wait indefinitely, which can't be stable either, since infinite persistence has infinite cost, worse than just giving up immediately for either player.", "The actual game-theoretic solution isn't a single fixed time, but a MIXED (randomized) strategy — a specific probability distribution over how long to persist.", "The equilibrium is a mixed strategy where each player draws their 'giving up time' from a specific exponential-like probability distribution, rather than committing to any single fixed duration. This models real biological and economic standoffs (animal contests, price wars, legal disputes) where unpredictability in HOW LONG a party will hold out is itself a rational, evolutionarily stable strategy."], ["Combinatorics", "How many distinct paths are there from the bottom-left corner to the top-right corner of a 5x5 grid, moving only right or up at each step (no diagonal or backward moves)?", "Any valid path consists of exactly 5 'right' moves and 5 'up' moves, in some order — the question is really about how many distinct ORDERINGS of these 10 moves exist.", "This is equivalent to choosing which 5 of the 10 total move-slots are 'right' moves (the rest are automatically 'up').", "The formula is C(10,5) — choosing 5 positions out of 10 for the right-moves.", "C(10,5) = 252 distinct paths. (A classic combinatorics/grid-path problem, directly related to Pascal's Triangle and binomial coefficients.)"], ["Paradox", "A barber in a village declares: 'I shave every man in this village who does not shave himself, and I shave no one who does shave himself.' Who shaves the barber?", "Consider the two possibilities directly: either the barber shaves himself, or he doesn't — check each against his own stated rule.", "If the barber shaves himself, then by his own rule ('I shave no one who shaves himself'), he should NOT shave himself — a direct contradiction.", "If the barber does NOT shave himself, then by his own rule ('I shave every man who doesn't shave himself'), he SHOULD shave himself — also a direct contradiction.", "Neither option is consistent — this is a genuine logical paradox (no valid answer exists within the stated rules), closely related to Russell's Paradox in set theory (the set of all sets that don't contain themselves). It shows that not every self-referential 'rule' or definition can be logically coherent, which had major consequences for the foundations of mathematics in the early 20th century. (The Barber Paradox, devised by Bertrand Russell.)"], ["Probability", "You have a standard deck of 52 cards, shuffled randomly. What's the probability that at least two cards of the same rank (like two 7s, or two Kings) end up in the exact same position when compared to a second freshly-shuffled deck, laid side by side?", "This is structurally similar to the 'Birthday Paradox,' but here you're comparing 52 fixed 'slots' (positions) between two decks, not asking whether any duplicates exist within one set.", "Rather than card-by-card independent probability, think of this as a 'derangement'-adjacent problem: what's the probability NO position matches at all, then subtract from 1.", "For large n (like 52), the probability of NO matches at all approaches 1/e (about 36.8%), a famous constant that shows up repeatedly in 'matching problems.'", "About 63.2% (1 − 1/e). This is the classic 'Matching Problem' (or 'Hat-Check Problem') — remarkably, as the number of items grows large, the probability of at least one match converges to a fixed constant (1 − 1/e ≈ 0.632) rather than continuing to change much, which is itself a surprising and elegant result."], ["Logic", "A castle has 64 rooms arranged in an 8x8 grid, like a chessboard, connected only to their direct (non-diagonal) neighbors. A knight-piece-shaped guard patrols using chess-knight moves (2 squares one way, 1 square perpendicular). Starting from any square, can the guard visit every single square on the board exactly once, ending anywhere (not necessarily back at the start)? This is the 'Knight's Tour' problem.", "Unlike the simpler question of whether a knight CAN reach every square eventually (trivially yes, the board is connected), this asks for a single continuous path hitting each square EXACTLY once.", "This has been studied extensively; the existence of such a tour depends on board size and shape — for a standard 8x8 board, the answer is known definitively.", "Additionally, some starting/ending square combinations allow a 'closed tour' (ending adjacent to a knight-move back to the start, forming a full loop), while others only allow 'open tours.'", "Yes, Knight's Tours exist on a standard 8x8 chessboard (both open and closed variants), and there are millions of distinct valid tours. This has been a subject of mathematical interest since at least the 9th century, and is provably impossible on some other board sizes/shapes (like certain small or oddly-shaped boards) due to coloring-argument constraints similar to the domino-tiling proof."], ["Math", "You want to cut a circular pizza into the maximum number of pieces using exactly 4 straight cuts (cuts can be at any angle, don't need to pass through the center, and pieces don't need to be equal). What's the maximum number of pieces achievable, and what's the general formula for n cuts?", "This is NOT simply 2× the number of cuts (that would only be true if every cut had to pass through a single common point) — non-crossing-through-center cuts can create more pieces.", "Each NEW cut should be arranged to cross every PREVIOUS cut at a distinct point, maximizing new regions created.", "The n-th cut, when crossing all (n-1) previous cuts at distinct points, adds exactly n new pieces to whatever you had before.", "The maximum is 11 pieces for 4 cuts. The general formula is 1 + n(n+1)/2 (or equivalently, the 'lazy caterer's sequence'): 1 cut→2 pieces, 2 cuts→4, 3 cuts→7, 4 cuts→11, 5 cuts→16, and so on — each new cut adds as many new pieces as the number of PREVIOUS cuts it crosses, plus 1. (The Lazy Caterer's Sequence / Circle Cutting Problem.)"], ["Game Theory", "In 'Rock-Paper-Scissors-Lizard-Spock' (a 5-option extension where each option beats exactly 2 others and loses to exactly 2 others), is there still a game-theoretically 'balanced' optimal strategy, similar to playing each of the original 3 options equally often in classic Rock-Paper-Scissors?", "In the classic 3-option game, the balanced Nash equilibrium is to play each option with equal 1/3 probability, since no option has an inherent advantage over the others in aggregate.", "Check whether the 5-option version has the same 'symmetric' property: does each of the 5 options beat exactly the same NUMBER of others, and lose to exactly the same number, as every other option?", "In this specific 5-option design, yes — every option beats exactly 2 and loses to exactly 2 (by careful design), maintaining the same symmetric structure as the 3-option version, just scaled up.", "Yes, the same logic applies: since every option is symmetric (beats exactly 2, loses to exactly 2), the balanced Nash equilibrium is to play each of the 5 options with equal 1/5 probability. This symmetric design is why the 5-option extension 'works' as a fair game — an asymmetrically designed extension (where some option had an inherent edge) would break this clean equal-probability equilibrium."], ["Logic", "You're shown 3 closed boxes. A sign on Box A says: 'The treasure is in this box.' A sign on Box B says: 'The treasure is not in this box.' A sign on Box C says: 'The treasure is not in Box A.' You're told AT MOST ONE of these 3 signs is true. Which box has the treasure?", "Test each box as the treasure location, one at a time, and count how many signs would be true in each scenario.", "If the treasure is in Box A: Sign A is true ('treasure is in this box' ✓), Sign B is true ('treasure is not in this box,' referring to B, which is correct since treasure is in A ✓), Sign C is false ('treasure is not in A' — but it IS in A). That's 2 true signs — too many (rule says at most 1).", "If the treasure is in Box B: Sign A is false, Sign B is false ('treasure is not in this box' — but it IS in B), Sign C is true ('treasure is not in A' — correct, it's in B). That's 1 true sign — consistent with the rule!", "The treasure is in Box B. Checking Box C as well for completeness: if treasure were in Box C, Sign A false, Sign B true ('not in B' — correct), Sign C true ('not in A' — also correct) = 2 true signs, violating the rule. Only the 'treasure in Box B' scenario produces exactly 1 true sign, satisfying the 'at most one true' constraint."], ["Math", "A single bacterium in a petri dish divides into 2 every minute (doubling). After exactly 60 minutes, the dish is completely full of bacteria. At what minute mark was the dish exactly HALF full?", "Resist the instinct to divide 60 by 2 — this isn't a linear filling process.", "Since the population DOUBLES every minute, work backward from the fully-full 60-minute mark by exactly one doubling step.", "If the dish is full at minute 60, it must have been exactly half as full just ONE minute earlier, at minute 59 (since doubling half gives you the full amount).", "Minute 59, not minute 30. Because growth is exponential (doubling), the dish goes from half-full to completely full in just the final single minute — a vivid illustration of how deceptively fast exponential growth accelerates right at the end, similar in spirit to the paper-folding puzzle."], ["Combinatorics", "In how many ways can 8 people be seated around a CIRCULAR table, if rotations of the same arrangement are considered identical (but reflections/mirror-images are considered different)?", "For seating in a STRAIGHT LINE, the answer would simply be 8! (8 factorial) — every permutation is distinct.", "But around a circular table, rotating everyone by one seat produces an arrangement that's really the 'same' relative seating, just rotated — these shouldn't be double counted.", "Since there are 8 possible rotations of any given circular arrangement that all represent the 'same' seating, divide the straight-line count by 8 to correct for this overcounting.", "8!/8 = 7! = 5,040 distinct circular seatings. (A classic circular-permutation formula: for n distinct objects arranged in a circle where only rotations are considered identical, the count is (n-1)! instead of n!.)"], ["Probability", "Three prisoners, A, B, and C, are told that 2 of them will be executed and 1 will be pardoned, chosen at random, but none of them knows who. Prisoner A asks the guard (who knows the outcome but won't reveal A's own fate): 'Can you at least tell me the name of ONE of the other two, B or C, who will be executed?' The guard, following a fixed rule of naming a doomed prisoner other than A if possible, says 'B will be executed.' Does this new information change Prisoner A's own probability of being pardoned, from the original 1/3?", "Before asking, A has a 1/3 chance of pardon (1 pardoned out of 3, uniformly at random) — this seems intuitively like it should now become 1/2 (down to just A and C), but check carefully.", "The guard's answer was NOT a random, informative event about A specifically — the guard was always going to be ABLE to name at least one doomed prisoner among B and C, regardless of whether A was the pardoned one or not.", "Since the guard's response doesn't discriminate based on A's own fate (a doomed B or C existed either way), this is structurally identical to a version of the Monty Hall Problem.", "A's probability of pardon remains 1/3 (NOT updated to 1/2) — the guard's revelation carries no new information about A specifically, since a name to reveal was guaranteed regardless of A's own fate. Interestingly, this ALSO means C's probability of pardon jumps to 2/3 (mirroring the 'switch' door in Monty Hall) — all of A's original 1/3 probability effectively 'transfers' onto C once B is revealed as doomed, exactly analogous to the classic 3-door problem. (The Three Prisoners Problem, a direct isomorphism of Monty Hall.)"], ["Number Theory", "Is it possible to arrange the numbers 1 through 15 in a sequence such that every pair of adjacent numbers sums to a perfect square?", "List out which pairs of numbers from 1-15 actually sum to a perfect square (like 1+3=4, 1+8=9, 2+7=9, 6+10=16, etc.) — this defines which numbers can be 'neighbors.'", "Think of each number as a node in a graph, with an edge connecting two numbers if their sum is a perfect square — you're now looking for a path that visits every node exactly once (a Hamiltonian path).", "Some numbers (like 15) have very few valid 'neighbors' under this rule, which constrains where they can go in the sequence significantly.", "Yes, it's possible: 8, 1, 15, 10, 6, 3, 13, 12, 4, 5, 11, 14, 2, 7, 9 is one valid sequence (check: 8+1=9, 1+15=16, 15+10=25, 10+6=16, 6+3=9, 3+13=16, 13+12=25, 12+4=16, 4+5=9, 5+11=16, 11+14=25, 14+2=16, 2+7=9, 7+9=16 — all perfect squares). This is a fun example of translating a number-theory question into a graph theory Hamiltonian-path search."], ["Logic", "A very strange island has 2 tribes: the Asu, who always tell the truth on even-numbered days of the month and lie on odd days, and the Bubu, who do the exact opposite (lie on even days, truth on odd days). You meet someone who says: 'I am Bubu, and today is an even day.' What tribe are they, and could you also determine the actual date's parity?", "Break the compound statement into 2 separate claims joined by 'and': Claim 1 ('I am Bubu') and Claim 2 ('today is even'). For the WHOLE statement to be true, BOTH claims must be true; if the person is lying, at least one part is false — actually, for a simple conjunction stated as ONE utterance by someone who either always lies or always tells truth on this specific day, the ENTIRE statement is either fully true or fully false, not evaluated part-by-part independently unless you're using their day/tribe rule directly.", "Test both possible tribes (Asu or Bubu) combined with both possible day parities (even or odd) — 4 total combinations — and check which combinations are self-consistent with the stated truth/lie schedule AND the content of the statement itself.", "If they're Bubu and it's an even day, Bubu lies on even days — so the statement should be a LIE, but the statement ('I am Bubu, today is even') would actually be TRUE in that scenario, contradicting the requirement that Bubu lies on even days.", "Testing all 4 combinations systematically, the only fully self-consistent scenario is: the speaker is Asu, and today is an ODD day. On an odd day, Asu lies (per their rule) — so their statement must be false, and indeed 'I am Bubu, and today is even' IS false (they're actually Asu, and it's actually odd) — a fully consistent lie. Every other combination produces a contradiction."], ["Game Theory", "In a 'Public Goods Game,' a group of 4 people each privately decide how much of their own $10 to contribute to a shared pot. The pot is then doubled and split EQUALLY among all 4, regardless of individual contribution. If everyone contributes their full $10, everyone ends up with $20 (doubling their money). But individually, why does each rational, self-interested player have an incentive to contribute NOTHING, even though this leads to a worse outcome for the group?", "Consider your own payoff from contributing $1 versus keeping it: if you contribute, that dollar becomes $2 in the pot, but you only get 1/4 of that back ($0.50) — a direct loss to you personally, even though the total group benefit is positive.", "This calculation holds true regardless of what everyone ELSE does — contributing is always a personal loss on the margin, even though collective full contribution helps everyone.", "This makes 'contribute nothing' a dominant strategy for a purely self-interested individual, similar in spirit to the Prisoner's Dilemma, but now among many players instead of just 2.", "Because each dollar you contribute only returns $0.50 to you personally (even though it returns $2 to the group collectively), a purely self-interested player should contribute nothing and simply free-ride on others' contributions. If everyone reasons this way, the group ends up with nothing in the pot at all — the worst possible collective outcome — despite full cooperation being better for everyone. This models real-world 'free rider' problems in public goods (like funding public infrastructure, environmental conservation, or open-source software), and is essentially a multi-player generalization of the Prisoner's Dilemma."], ["Math", "Prove (or explain intuitively) why the square root of 2 cannot be expressed as a fraction of two whole numbers (i.e., it's irrational).", "Assume, for contradiction, that √2 = a/b, where a and b are whole numbers with no common factors (the fraction is fully reduced).", "Squaring both sides: 2 = a²/b², so a² = 2b² — meaning a² is even, which means a itself must be even (since odd numbers squared are always odd).", "If a is even, write a = 2k for some whole number k; substituting back, 4k² = 2b², so b² = 2k² — meaning b² is also even, so b is also even.", "But if both a and b are even, they share a common factor of 2 — contradicting our starting assumption that a/b was fully reduced with no common factors. This contradiction proves √2 cannot be written as any fraction of whole numbers — it's irrational. (A classic 'proof by contradiction,' known since ancient Greek mathematics and often attributed to the Pythagoreans.)"], ["Logic", "An urn contains 3 balls: unknown to you, they could be any mix of red and white. You draw a ball, note its color, and PUT IT BACK, then draw again, repeating this 3 times. All 3 draws come up red. If you had to bet on the urn's actual composition, why is 'all 3 balls are red' more likely than 'exactly 2 are red, 1 is white,' even though both are plausible?", "Before drawing, consider the possible urn compositions equally likely: 0,1,2, or 3 red balls (or use a specific prior if given one).", "Calculate the probability of seeing 'red 3 times in a row' under EACH possible composition (e.g., if 2 of 3 are red, each draw has a 2/3 chance of red, so 3-in-a-row has probability (2/3)³ ≈ 30%; if all 3 are red, every draw is guaranteed red, probability 1).", "Compare these likelihoods: the 'all red' composition makes the observed evidence (3 reds) far more probable than the '2 red, 1 white' composition does.", "Using Bayesian updating, 'all 3 balls are red' becomes the most probable explanation after seeing 3 reds in a row, because that composition makes the observed evidence maximally likely (probability 1), while the 2-red composition only explains it with probability (2/3)³ ≈ 0.30 — a clean illustration of Bayesian inference favoring the hypothesis that best explains the data."], ["Combinatorics", "You're given 3 ropes of different lengths and told to find the shortest path connecting 4 cities laid out as the corners of a square, without necessarily following straight lines between just pairs of them (extra 'junction' points not at any city are allowed). Why can adding an extra junction point sometimes make the TOTAL connecting path shorter than any direct city-to-city network?", "A simple 'connect the dots' network (like the square's own perimeter minus one side, or its two diagonals) is a reasonable first guess, but isn't always shortest.", "Consider adding 2 extra internal junction points, and connecting things in a Y-like/H-like branching pattern instead of straight city-to-city lines.", "The optimal solution meets at junctions with exactly 120-degree angles between each pair of connecting lines — this is the mathematical condition for a locally optimal branching point.", "This is the 'Steiner Tree Problem' — for 4 corners of a square, the shortest connecting network uses 2 extra Steiner points inside the square, with all angles at each junction equal to 120°, and is provably about 13% shorter than simply using the square's perimeter minus one side. This has real-world applications in network design (minimizing total cable/pipe/road length) and even models natural phenomena like soap film patterns."], ["Probability", "A biased coin comes up heads with an unknown probability p. You flip it 10 times and get 7 heads. What is your best single estimate for p, and why is 7/10 the 'right' answer using a specific statistical principle rather than just being an intuitive guess?", "Consider the 'likelihood' of observing exactly 7 heads out of 10 flips, as a function of the unknown value p — this likelihood is highest for SOME specific value of p.", "The likelihood function here is proportional to p^7 × (1-p)^3 (7 heads, each with probability p; 3 tails, each with probability 1-p).", "To find the p that maximizes this expression, take the derivative with respect to p, set it to zero, and solve.", "The maximum occurs exactly at p = 7/10 = 0.7. This is the principle of Maximum Likelihood Estimation (MLE): among all possible values of p, 0.7 is the one that makes the actually-observed data (7 heads in 10 flips) most probable — which is why the intuitive '7/10' answer is also the formally rigorous statistical best estimate, not just a coincidence."], ["Game Theory", "In 'Guess 2/3 of the Average,' a group of players each simultaneously pick a number from 0 to 100. Whoever's guess is closest to 2/3 of the AVERAGE of all guesses wins. Using pure game-theoretic reasoning (assuming everyone is perfectly rational and knows everyone else is too), what number should a perfectly rational player pick?", "If everyone guessed randomly, the average would be around 50, so 2/3 of that is about 33 — but rational players should anticipate this and adjust.", "If everyone independently reasons their way to guessing 33, the new average becomes 33, so the new target is 2/3 of 33 ≈ 22 — but this reasoning itself can be anticipated by others too, recursively.", "This recursive 'I think that you think that I think...' reasoning, taken to its logical conclusion (infinite iterations), converges toward a single fixed point.", "The game-theoretic equilibrium answer is 0. If every player is perfectly rational and this is common knowledge, the recursive reasoning drives every guess down to 0 (the only stable fixed point, since 2/3 of 0 is still 0). In REAL experiments with human players (who aren't perfectly recursive reasoners), average winning guesses tend to be around 20-35, not 0 — a famous demonstration of the gap between idealized game theory and real bounded-rationality behavior."], ["Math", "You have an old-fashioned balance scale and want to determine the minimum number of weighings to sort 8 people into order by weight, given you can only compare 2 people (or groups) against each other per weighing, with no numeric readout — just 'heavier,' 'lighter,' or 'equal.' What is the minimum number of comparisons (weighings) needed in the worst case to FULLY sort all 8, and what's the general principle?", "This is equivalent to the 'comparison sorting' problem in computer science — sorting n items using only pairwise comparisons.", "The theoretical minimum number of comparisons needed to sort n items (in the worst case) is related to log2(n!) — because each comparison gives at most 1 bit of information, and there are n! possible orderings to distinguish between.", "For n=8, log2(8!) = log2(40320) ≈ 15.3, so at least 16 comparisons are needed in the worst case (rounding up) — though achieving exactly this minimum requires a cleverly optimal comparison strategy (like merge sort's comparison pattern), not just any sorting method.", "The information-theoretic lower bound is ⌈log2(8!)⌉ = 16 weighings, and this bound is achievable with an optimal comparison-based sorting algorithm. This illustrates a deep computer science principle: any comparison-based sorting algorithm needs at least O(n log n) comparisons in the worst case, and this can be proven purely from information theory (counting how many yes/no questions are needed to distinguish among all possible orderings), independent of any specific algorithm's implementation."], ["Logic", "Two perfectly logical people are each told a different single-digit number (0-9), and told that the two numbers differ by exactly 1. Neither can see the other's number. They're asked, in alternating turns, 'Do you know the other person's number?' Both keep answering 'No' for a surprisingly long time — until suddenly one says 'Yes.' If the numbers were 4 and 5, on which round does the 'Yes' first occur, and why does the SPECIFIC value of the numbers (not just their difference) matter here?", "A person holding '0' would know immediately that the other has '1' (since 0-1 isn't a valid single-digit number, only 0+1=1 works) — so low numbers get resolved fastest.", "Similarly, a person holding '9' would know immediately the other has '8' (since 9+1=10 isn't a valid single digit).", "Each round of mutual 'No' answers eliminates the CURRENT smallest and largest remaining possible numbers from consideration (since holders of those extreme values would have already answered 'Yes'), progressively narrowing the range inward from both ends.", "With numbers 4 and 5, this elimination process (removing 0, then 9, then 1, then 8, then 2, then 7, then 3, then 6, narrowing in from both extremes each round) takes several rounds before the middle values 4 and 5 become resolvable — specifically, the 'Yes' emerges on the round when the elimination front reaches values 4/5 from both directions, which works out to the 4th round of questioning for a 0-9 range. The key insight is that this puzzle's timing depends on how close the true numbers are to the CENTER of the possible range, not just on their difference of 1."], ["Paradox", "Newcomb's Paradox: a highly reliable predictor (correct 99% of the time in the past) presents you with 2 boxes. Box A always contains $1,000 (visible). Box B contains either $1,000,000 or $0, depending on what the predictor predicted YOU would do, decided and sealed BEFORE you choose. If the predictor predicted you'd take only Box B, it put $1M in Box B; if it predicted you'd take BOTH boxes, it left Box B empty. You may choose to take only Box B, or take both boxes. What should you do, and why do two seemingly valid arguments give opposite answers?", "The 'dominance' argument: whatever's already in Box B is FIXED and can't change now, no matter what you choose — so taking both boxes always gets you at least as much money as taking just Box B, regardless of what's inside (it's already decided).", "The 'expected value' argument: given the predictor's 99% accuracy, choosing 'only Box B' is correlated with the predictor having predicted that, meaning you'd very likely get $1,000,000 — while choosing 'both boxes' is correlated with the predictor having predicted THAT, leaving Box B empty, netting only $1,000.", "These two arguments rest on different underlying assumptions about causality and correlation — whether your CHOICE can be treated as independent evidence about a prediction that was already fixed in the past, even though it can't literally cause a change to the past.", "This is a genuinely unresolved philosophical paradox with serious, still-active academic debate — 'one-boxers' (who take only Box B, following expected-value/evidential reasoning) and 'two-boxers' (who take both, following the dominance/causal-independence argument) both have coherent, defensible positions. It exposes a real tension between two different formal theories of rational decision-making (causal decision theory vs. evidential decision theory) that philosophers have not fully reconciled."]];

let order = [], idx = 0, cluesShown = 0, solved = 0, seen = 0;
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function startSet() {
  order = shuffle([...Array(PUZZLES.length).keys()]);
  idx = 0; solved = 0; seen = 0;
  loadPuzzle();
}
function loadPuzzle() {
  cluesShown = 0;
  const p = PUZZLES[order[idx]];
  document.getElementById('progress').textContent = `Puzzle ${idx + 1} of ${order.length}`;
  document.getElementById('category').textContent = p[0];
  document.getElementById('prompt').textContent = p[1];
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('clue' + i);
    el.textContent = 'Clue ' + i + ': ' + p[1 + i];
    el.classList.remove('on');
  }
  const ansEl = document.getElementById('answerBox');
  ansEl.textContent = '✅ ' + p[5];
  ansEl.classList.remove('on');
  document.getElementById('btnClue').disabled = false;
  document.getElementById('btnClue').textContent = 'Show Clue 1';
  updateScore();
}
function showNextClue() {
  if (cluesShown >= 3) return;
  cluesShown++;
  document.getElementById('clue' + cluesShown).classList.add('on');
  document.getElementById('btnClue').textContent = cluesShown < 3 ? `Show Clue ${cluesShown + 1}` : 'All clues shown';
  if (cluesShown === 3) document.getElementById('btnClue').disabled = true;
}
function showAnswer() {
  const ansEl = document.getElementById('answerBox');
  if (!ansEl.classList.contains('on')) { seen++; updateScore(); }
  ansEl.classList.add('on');
}
function nextPuzzle() {
  idx = (idx + 1) % order.length;
  if (idx === 0) shuffle(order);
  loadPuzzle();
}
function updateScore() {
  document.getElementById('scoreDisplay').textContent = `${seen}/${order.length} revealed`;
}
document.getElementById('btnClue').addEventListener('click', showNextClue);
document.getElementById('btnAnswer').addEventListener('click', showAnswer);
document.getElementById('btnNext').addEventListener('click', nextPuzzle);
document.getElementById('btnRestart').addEventListener('click', startSet);
startSet();
</script>
</body>
</html>
